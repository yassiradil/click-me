<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: blue;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    button {
      background: white;
      color: black;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    img {
      width: 200px;
      display: none; /* مخفية في البداية */
    }
  </style>
</head>
<body>

  <button onclick="showImage()">Show Image</button>

  <img id="myImage" src="image.jpg.PNG">

  <script>
    function showImage() {
      document.getElementById("myImage").style.display = "block";
    }
  </script>

</body>
</html>
